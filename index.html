<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eff6ff"><title>健診まで</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><p class="eyebrow">健康診断までの体重記録</p><h1>健診まで</h1></div><button id="settingsBtn" class="ghost">目標設定</button></header>
<main>
<section class="hero card"><div><p id="todayLabel" class="muted"></p><h2>今日の体重</h2><form id="weightForm"><label><span>体重</span><div class="weight-input"><input id="weightInput" type="number" inputmode="decimal" min="30" max="250" step="0.1" required><b>kg</b></div></label><label><span>メモ（任意）</span><input id="memoInput" maxlength="80" placeholder="外食、運動など"></label><button type="submit" class="primary">記録する</button></form><p id="formMessage" class="message" aria-live="polite"></p></section>
<section class="stats"><article class="card"><span>前日比</span><strong id="dayDiff">--</strong><small id="dayDiffNote">昨日の記録がありません</small></article><article class="card"><span>7日間の変化</span><strong id="weekDiff">--</strong><small>最初と最後の記録を比較</small></article><article class="card"><span>目標まで</span><strong id="goalDiff">--</strong><small id="goalDateText">目標を設定してください</small></article></section>
<section class="card chart-card"><div class="section-head"><div><p class="eyebrow">推移</p><h2>体重グラフ</h2></div><div class="segmented" id="rangeButtons"><button data-range="7" class="active">7日</button><button data-range="30">30日</button><button data-range="90">3か月</button><button data-range="all">全期間</button></div></div><canvas id="weightChart" height="280"></canvas><div class="legend"><span>● 日ごとの体重</span><span>─ 7日平均</span><span>┄ 目標体重</span></div></section>
<section class="card"><div class="section-head"><div><p class="eyebrow">記録一覧</p><h2>最近の記録</h2></div><button id="exportBtn" class="ghost">バックアップ</button></div><div id="recordsList" class="records"></div></section>
<section class="card safety"><h2>データ保護</h2><p>体重データはこの端末のブラウザ内だけに保存され、外部には送信されません。</p><div class="actions"><label class="ghost file-label">復元ファイルを選ぶ<input id="importInput" type="file" accept="application/json,.json"></label><button id="clearBtn" class="danger">全データ削除</button></div></section>
</main>
<dialog id="settingsDialog"><form method="dialog" id="settingsForm"><div class="section-head"><h2>目標設定</h2><button value="cancel" class="icon-btn" aria-label="閉じる">×</button></div><label><span>目標体重</span><input id="goalWeightInput" type="number" min="30" max="250" step="0.1"></label><label><span>健康診断日</span><input id="goalDateInput" type="date"></label><div class="dialog-actions"><button value="cancel" class="ghost">キャンセル</button><button id="saveSettingsBtn" value="default" class="primary">保存</button></div></form></dialog>
<script src="core.js"></script><script src="app.js"></script></body></html>
