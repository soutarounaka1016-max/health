<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef6f2"><title>健診まで+</title><link rel="stylesheet" href="styles.css"></head><body><header><div><p class="eyebrow">健康診断までの生活改善</p><h1>健診まで+</h1></div><button id="settingsBtn" class="ghost">設定</button></header><nav id="tabs"><button data-tab="home" class="active">ホーム</button><button data-tab="daily">毎日</button><button data-tab="report">レポート</button><button data-tab="checkup">健診</button><button data-tab="data">データ</button></nav><main><section id="home" class="tab active"><div class="hero card"><p id="countdown" class="eyebrow"></p><h2>今日も記録できます</h2><div class="stats"><article><span>最新体重</span><strong id="latestWeight">--</strong></article><article><span>今週平均</span><strong id="weekAvg">--</strong></article><article><span>前週差</span><strong id="weekCompare">--</strong></article><article><span>目標まで</span><strong id="goalDiff">--</strong></article></div></div><div class="card"><h2>体重の推移</h2><canvas id="weightChart" height="260"></canvas></div><div class="card"><h2>今週のまとめ</h2><div id="weeklySummary"></div></div></section><section id="daily" class="tab"><div class="card"><h2>今日の記録</h2><form id="dailyForm"><div class="grid"><label>日付<input id="dateInput" type="date" required></label><label>体重<input id="weightInput" type="number" min="30" max="250" step="0.1" inputmode="decimal" required></label></div><fieldset><legend>行動目標</legend><div id="habitChecks" class="checks"></div></fieldset><fieldset><legend>生活タグ</legend><div id="tagChecks" class="checks"></div></fieldset><label>メモ<input id="memoInput" maxlength="120" placeholder="外食、睡眠、運動など"></label><label>食事写真（端末内保存）<input id="photoInput" type="file" accept="image/*"></label><img id="photoPreview" class="preview" hidden><button class="primary" type="submit">保存</button><p id="dailyMessage" class="message"></p></form></div><div class="card"><h2>最近の記録</h2><div id="recordsList"></div></div></section><section id="report" class="tab"><div class="card"><h2>週間レポート</h2><div id="reportContent"></div><div class="actions"><button id="shareReportBtn" class="primary">共有用レポート</button><button id="downloadReportBtn" class="ghost">テキスト保存</button></div></div><div class="card"><h2>生活タグとの関連</h2><div id="tagInsights"></div></div></section><section id="checkup" class="tab"><div class="card"><h2>健康診断結果</h2><form id="checkupForm"><div class="grid"><label>年度<input id="checkupYear" type="number" min="2000" max="2100" required></label><label>体重<input id="cWeight" type="number" step="0.1"></label><label>腹囲<input id="waist" type="number" step="0.1"></label><label>収縮期血圧<input id="sys" type="number"></label><label>拡張期血圧<input id="dia" type="number"></label><label>LDL<input id="ldl" type="number"></label><label>中性脂肪<input id="tg" type="number"></label><label>血糖値<input id="glucose" type="number"></label><label>γ-GTP<input id="ggt" type="number"></label></div><button class="primary" type="submit">健診結果を保存</button></form></div><div class="card"><h2>年度比較</h2><div id="checkupTable"></div><p class="muted">数値の診断は行いません。前回との変化を確認する記録機能です。</p></div></section><section id="data" class="tab"><div class="card"><h2>目標と行動設定</h2><form id="settingsForm"><div class="grid"><label>目標体重<input id="goalWeightInput" type="number" min="30" max="250" step="0.1"></label><label>健康診断日<input id="goalDateInput" type="date"></label></div><label>行動目標（1行1つ）<textarea id="habitsInput" rows="5"></textarea></label><button class="primary" type="submit">設定を保存</button></form></div><div class="card"><h2>バックアップと復元</h2><div class="actions"><button id="exportBtn" class="ghost">JSONバックアップ</button><label class="ghost file-label">復元ファイル<input id="importInput" type="file" accept="application/json,.json"></label><button id="clearBtn" class="danger">全データ削除</button></div><p class="muted">健康データと写真はこのブラウザ内に保存され、外部へ自動送信されません。</p></div></section></main><script src="core.js"></script><script src="app.js"></script></body></html>
